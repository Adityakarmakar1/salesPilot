# Render Blueprint — one Docker web service + one free Postgres database.
# Deploy: Render dashboard → New → Blueprint → point at this repo → fill the
# secret env vars (sync: false) → Apply. See README.md for the full walkthrough.
databases:
  - name: salespilot-db
    plan: free
    databaseName: salespilot
    user: salespilot

services:
  - type: web
    name: salespilot-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salespilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Secrets — entered by you in the Render dashboard, never committed.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      # Optional — only used when LLM_PROVIDER=openai (also enables
      # OpenAI embeddings in that mode):
      # - key: OPENAI_API_KEY
      #   sync: false
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
