# SalesPilot AI — local / self-host stack: Postgres + the app (API + frontend).
# Usage: cp .env.example .env  (fill in secrets)  →  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: salespilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salespilot_dev_password}
      POSTGRES_DB: salespilot
    volumes:
      - salespilot_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salespilot -d salespilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside compose, the database is the "db" service.
      DATABASE_URL: postgresql+psycopg://salespilot:${POSTGRES_PASSWORD:-salespilot_dev_password}@db:5432/salespilot
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  salespilot_db:
